<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-AI Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col font-sans">

    <!-- HEADER -->
    <header class="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-10 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2 rounded-lg text-white">
                    <i class="fa-solid fa-robot text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Multi-AI Arena</h1>
                    <p class="text-xs text-gray-400">1 Prompt ke Banyak AI Sekaligus</p>
                </div>
            </div>
            <button onclick="clearChat()" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-lg border border-gray-700 transition">
                <i class="fa-solid fa-trash-can mr-1"></i> Bersihkan Chat
            </button>
        </div>
    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto p-4 flex flex-col gap-4">

        <!-- PANEL SETUP / CONFIG -->
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 shadow-xl">
            <!-- API KEY INPUT -->
            <div class="mb-4">
                <label class="block text-xs font-semibold text-gray-400 mb-1">OPENROUTER API KEY</label>
                <div class="flex gap-2">
                    <input type="password" id="apiKey" placeholder="sk-or-v1-..." 
                           class="flex-1 bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-blue-500 transition">
                    <button onclick="saveApiKey()" class="bg-gray-800 hover:bg-gray-700 text-xs px-4 py-2 rounded-xl border border-gray-700 font-semibold transition">
                        Simpan Key
                    </button>
                </div>
                <p id="keyStatus" class="text-[11px] text-gray-500 mt-1"></p>
            </div>

            <!-- PILIHAN MODEL AI -->
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-2">PILIH MODEL AI YANG DIFAKTIFKAN:</label>
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-2 text-xs">
                    <label class="flex items-center gap-2 bg-gray-950 p-2.5 rounded-xl border border-gray-800 cursor-pointer hover:border-gray-700">
                        <input type="checkbox" value="google/gemini-2.0-flash-001" class="ai-checkbox rounded accent-blue-600" checked>
                        <span class="truncate">Gemini 2.0 Flash</span>
                    </label>

                    <label class="flex items-center gap-2 bg-gray-950 p-2.5 rounded-xl border border-gray-800 cursor-pointer hover:border-gray-700">
                        <input type="checkbox" value="openai/gpt-4o-mini" class="ai-checkbox rounded accent-blue-600" checked>
                        <span class="truncate">GPT-4o Mini</span>
                    </label>

                    <label class="flex items-center gap-2 bg-gray-950 p-2.5 rounded-xl border border-gray-800 cursor-pointer hover:border-gray-700">
                        <input type="checkbox" value="deepseek/deepseek-r1:free" class="ai-checkbox rounded accent-blue-600" checked>
                        <span class="truncate">DeepSeek R1 (Free)</span>
                    </label>

                    <label class="flex items-center gap-2 bg-gray-950 p-2.5 rounded-xl border border-gray-800 cursor-pointer hover:border-gray-700">
                        <input type="checkbox" value="anthropic/claude-3.5-haiku" class="ai-checkbox rounded accent-blue-600">
                        <span class="truncate">Claude 3.5 Haiku</span>
                    </label>

                    <label class="flex items-center gap-2 bg-gray-950 p-2.5 rounded-xl border border-gray-800 cursor-pointer hover:border-gray-700">
                        <input type="checkbox" value="meta-llama/llama-3.3-70b-instruct" class="ai-checkbox rounded accent-blue-600">
                        <span class="truncate">Llama 3.3 70B</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- CONTAINER CHAT -->
        <div id="chatArea" class="flex-1 bg-gray-900 border border-gray-800 rounded-2xl p-4 min-h-[350px] overflow-y-auto flex flex-col gap-6">
            <div id="placeholder" class="m-auto text-center text-gray-600">
                <i class="fa-solid fa-comments text-4xl mb-2"></i>
                <p class="text-sm">Tulis pertanyaan di bawah untuk memulai perbandingan respon AI</p>
            </div>
        </div>

        <!-- INPUT CHAT -->
        <div class="flex gap-2">
            <textarea id="promptInput" rows="2" placeholder="Tanyakan sesuatu ke semua AI..." 
                      class="flex-1 bg-gray-900 border border-gray-800 rounded-2xl p-3 text-sm focus:outline-none focus:border-blue-500 transition resize-none"></textarea>
            <button onclick="sendPrompt()" id="sendBtn" class="bg-blue-600 hover:bg-blue-500 font-bold px-6 rounded-2xl transition flex items-center justify-center text-white">
                <i class="fa-solid fa-paper-plane text-lg"></i>
            </button>
        </div>

    </main>

    <script>
        // Load Saved API Key
        window.onload = () => {
            const savedKey = localStorage.getItem('openrouter_key');
            if (savedKey) {
                document.getElementById('apiKey').value = savedKey;
                document.getElementById('keyStatus').innerText = '✓ API Key tersimpan di browser';
                document.getElementById('keyStatus').className = 'text-[11px] text-green-400 mt-1';
            }
        };

        function saveApiKey() {
            const key = document.getElementById('apiKey').value.trim();
            if (key) {
                localStorage.setItem('openrouter_key', key);
                document.getElementById('keyStatus').innerText = '✓ API Key berhasil disimpan!';
                document.getElementById('keyStatus').className = 'text-[11px] text-green-400 mt-1';
            } else {
                localStorage.removeItem('openrouter_key');
                document.getElementById('keyStatus').innerText = 'API Key dihapus';
                document.getElementById('keyStatus').className = 'text-[11px] text-gray-500 mt-1';
            }
        }

        function clearChat() {
            const chatArea = document.getElementById('chatArea');
            chatArea.innerHTML = `
                <div id="placeholder" class="m-auto text-center text-gray-600">
                    <i class="fa-solid fa-comments text-4xl mb-2"></i>
                    <p class="text-sm">Tulis pertanyaan di bawah untuk memulai perbandingan respon AI</p>
                </div>
            `;
        }

        async function sendPrompt() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const promptInput = document.getElementById('promptInput');
            const prompt = promptInput.value.trim();
            const selectedModels = Array.from(document.querySelectorAll('.ai-checkbox:checked')).map(cb => cb.value);

            if (!apiKey) return alert('Silahkan masukkan API Key OpenRouter kamu terlebih dahulu!');
            if (!prompt) return alert('Ketik pertanyaan kamu dulu!');
            if (selectedModels.length === 0) return alert('Pilih minimal 1 AI!');

            // Simpan API key jika belum tersimpan
            localStorage.setItem('openrouter_key', apiKey);

            const chatArea = document.getElementById('chatArea');
            const placeholder = document.getElementById('placeholder');
            if (placeholder) placeholder.remove();

            // 1. Tampilkan Bubble User
            const userMsgBlock = document.createElement('div');
            userMsgBlock.className = 'flex justify-end';
            userMsgBlock.innerHTML = `
                <div class="bg-blue-600 text-white p-3 rounded-2xl max-w-[85%] text-sm shadow-md">
                    ${escapeHtml(prompt)}
                </div>
            `;
            chatArea.appendChild(userMsgBlock);

            promptInput.value = '';

            // 2. Buat Wadah Respons Paralel
            const responseGrid = document.createElement('div');
            const cols = selectedModels.length === 1 ? 'grid-cols-1' : selectedModels.length === 2 ? 'grid-cols-1 md:grid-cols-2' : 'grid-cols-1 md:grid-cols-3';
            responseGrid.className = `grid ${cols} gap-3 w-full my-2`;

            selectedModels.forEach(model => {
                const modelName = model.split('/')[1] || model;
                const safeId = 'ai-' + model.replace(/[^a-zA-Z0-9]/g, '-');

                const card = document.createElement('div');
                card.className = 'bg-gray-950 border border-gray-800 rounded-2xl p-4 text-xs flex flex-col gap-2 shadow-inner';
                card.id = safeId;
                card.innerHTML = `
                    <div class="flex items-center justify-between border-b border-gray-800 pb-2">
                        <span class="font-bold text-blue-400">${modelName}</span>
                        <span class="status text-[10px] bg-yellow-900/50 text-yellow-300 px-2 py-0.5 rounded-full animate-pulse">Mengetik...</span>
                    </div>
                    <div class="content text-gray-300 leading-relaxed whitespace-pre-wrap min-h-[60px]">...</div>
                `;
                responseGrid.appendChild(card);
            });

            chatArea.appendChild(responseGrid);
            chatArea.scrollTop = chatArea.scrollHeight;

            // 3. Kirim Perintah ke Masing-Masing AI (Paralel)
            selectedModels.forEach(async (model) => {
                const safeId = 'ai-' + model.replace(/[^a-zA-Z0-9]/g, '-');
                const card = document.getElementById(safeId);
                const contentDiv = card.querySelector('.content');
                const statusSpan = card.querySelector('.status');

                try {
                    const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                        method: "POST",
                        headers: {
                            "Authorization": `Bearer ${apiKey}`,
                            "HTTP-Referer": "http://localhost:8080",
                            "X-Title": "Multi-AI Workspace",
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            model: model,
                            messages: [{ role: "user", content: prompt }]
                        })
                    });

                    const data = await response.json();

                    if (data.choices && data.choices[0]) {
                        contentDiv.innerText = data.choices[0].message.content;
                        statusSpan.innerText = 'Selesai';
                        statusSpan.className = 'status text-[10px] bg-green-900/50 text-green-400 px-2 py-0.5 rounded-full';
                    } else {
                        contentDiv.innerText = "Error: " + (data.error?.message || "Gagal mengambil jawaban");
                        statusSpan.innerText = 'Error';
                        statusSpan.className = 'status text-[10px] bg-red-900/50 text-red-400 px-2 py-0.5 rounded-full';
                    }
                } catch (err) {
                    contentDiv.innerText = "Terjadi kesalahan jaringan atau API Key tidak valid.";
                    statusSpan.innerText = 'Gagal';
                    statusSpan.className = 'status text-[10px] bg-red-900/50 text-red-400 px-2 py-0.5 rounded-full';
                }
                chatArea.scrollTop = chatArea.scrollHeight;
            });
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
